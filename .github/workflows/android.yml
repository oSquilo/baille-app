name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android, ícone e tela de abertura
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#040308" --iconBackgroundColorDark "#040308" --splashBackgroundColor "#040308" --splashBackgroundColorDark "#040308"
          npx cap sync android

      - name: Usar a mesma chave em todas as versões (permite atualizar por cima)
        run: |
          mkdir -p ~/.android
          cp chave-android/debug.keystore ~/.android/debug.keystore

      - name: Compilar o APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Baille.apk

      - name: Guardar o APK na execução
        uses: actions/upload-artifact@v4
        with:
          name: Baille-apk
          path: Baille.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Baille 1.0.${{ github.run_number }}
          body: |
            Baixe o **Baille.apk** abaixo pelo celular Android e toque nele para instalar.
            Se o Android pedir, permita "instalar apps desta fonte".
          files: Baille.apk
